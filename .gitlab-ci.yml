include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/network-troubleshooting-tools
  TgsSettingKey: network-troubleshooting-tools
  HelmTemplateFolderName: network-troubleshooting-tools
  BuildCacheKey: Tgs.NetworkTroubleshooterTools.WebApplication.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore --no-build

push-docker-image:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true   
    policy: pull
  script:
    #- dotnet build "Tgs.NetworkTroubleshooterTools.WebApplication/Tgs.NetworkTroubleshooterTools.WebApplication.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$ImageName:$Tag" --no-restore
    #- dotnet publish "Tgs.NetworkTroubleshooterTools.WebApplication" 
    #   --os linux --arch x64
    #   /t:PublishContainer
    #   -c $BuildConfiguration
    #   /p:ContainerRepository=$ImageName
    #   /p:ContainerImageTag=$Tag
    - docker build -t "$ImageName:$Tag" --build-arg [BUILD_CONFIGURATION]=$BuildConfiguration -f "Tgs.NetworkTroubleshooterTools.WebApplication/Dockerfile" . --no-cache
    - docker push $ImageName:$Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateFolderName $ImageName $Tag

deploy-dev:
  extends: .deploy-k8s-template
  image: 
    name: pgtgs/tgs-backend-deploy:latest
  variables:
    namespace: dev
    replica: 1
    DedicatedKey: dedicated
    NodeSelectorKey: node-selector
  environment:
    name: service-dev
  stage: deploy-dev
  tags:
    - dev
    - kubernetes
    - deploy
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace

deploy-staging:
  extends: .deploy-k8s-template
  image: 
    name: pgtgs/tgs-backend-deploy:latest
  variables:
    namespace: staging
    replica: 1
    DedicatedKey: dedicated
    NodeSelectorKey: node-selector
    ingressEnabled: true
    domain: "${TgsSettingKey}.rpgp.cc"
  environment:
    name: service-staging
  stage: deploy-staging
  tags:
    - staging
    - kubernetes
    - deploy
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
    - create_dns 'staging' ${TgsSettingKey}

deploy-prod:
  extends: .deploy-k8s-template
  image: 
    name: pgtgs/tgs-backend-deploy:latest
  variables:
    namespace: prod
    replica: 1
    DedicatedKey: dedicated
    NodeSelectorKey: node-selector
    ingressEnabled: true
    domain: "${TgsSettingKey}.srvptt.com"
  environment:
    name: service-prod
  stage: deploy-prod
  tags:
    - prod
    - kubernetes
    - deploy
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
    - create_dns 'prod' ${TgsSettingKey}